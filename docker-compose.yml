
services:
  # redis làm message broker và cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # minio lưu trữ ảnh độc lập cho local dev
  minio:
    image: minio/minio:latest
    ports:
      - "${IMAGE_AI_MINIO_PORT:-9000}:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${IMAGE_AI_MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${IMAGE_AI_MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # service chính chạy gRPC + REST API
