  #   environment:
  #     - REDIS_URL=${REDIS_URL}
  #     - CELERY_BROKER_URL=${CELERY_BROKER_URL}
  #     - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
  #     - MINIO_ENDPOINT=${MINIO_ENDPOINT}
  #     - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
  #   volumes:
  #     - ./proto:/app/proto
  #     - ./src:/app/src
  #     - prometheus_multiproc:/tmp/prometheus_multiproc
  #   depends_on:
  #     - redis
  #     - minio

  # worker xử lý sinh ảnh bằng GPU
  # celery-worker:
  #   build: .
  #   command: celery -A worker.celery_app worker --loglevel=info --concurrency=1
  #   environment:
  #     - REDIS_URL=${REDIS_URL}
  #     - CELERY_BROKER_URL=${CELERY_BROKER_URL}
  #     - CELERY_RESULT_BACKEND=${CELERY_RESULT_BACKEND}
  #     - MINIO_ENDPOINT=${MINIO_ENDPOINT}
  #     - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus_multiproc
  #   volumes:
  #     - prometheus_multiproc:/tmp/prometheus_multiproc
  #   deploy:
  #     resources:
